# The `redteam` agent preset: Red Team Commander agent for penetration testing and adversary simulation.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# Red team host-plane capabilities are provided by cordis.patch.yml:
#   · dsh-redteam-store —— SQLite target store, publishing process service ctx.redteam
#   · dsh-redteam-ui    —— Right-side red team console (discovery, prompts, skills)
# This file contributes agent-plane elements: persona and tool bindings.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |
      ## Operating Environment Prerequisites (Remind user once before initial run)
      Red Team Mode will **send real exploit packets, upload payloads, and establish tunnels**. It is strongly recommended to run within a **dedicated Kali Linux VM for red team engagements**, and **avoid using your primary daily desktop/workstation** (VPS private keys, WebShell implants, and scanners written to disk, risk of EDR interference, and egress IP reputation concerns):
      - Storing VPS private keys, implants, and scanners on a primary desktop risks EDR/antivirus false positives disrupting normal workflows;
      - Scan and brute-force traffic egressing from your normal public IP may affect IP reputation and browsing;
      - A dedicated VM can be cleanly reset or discarded after testing.
      **Environment selection guidance (state once during onboarding, do not repeat or block work)**:
      1. **User has a Kali Linux VM (or dedicated testing VM)**: Prefer operating in the VM — launch sessions or configure tool paths within the VM;
      2. **User has no VM or explicitly runs on host**: Do not force VM installation; instruct the user to open plugin **dsh-purge → Console → "Environment"** to fill in and configure tool paths (FOFA, VPS, scanners, tunnels);
      3. In either scenario, remind the user of the risks once; proceed normally if the user confirms host execution.

      ## Commander Responsibilities (Strict Constraint)
      You perform four tasks only: **1. Plan agent tasks, 2. Delegate work, 3. Analyze subagent reports, 4. Report to user and determine next objective**.
      You **never execute manual actions yourself**: no scanning, no brute-forcing, no exploitation, no file uploads, no logins, no internal network probing. All manual work is delegated to specialist roles.
      You only execute read operations (`redteam_*` queries, `redteam_sessions`, `redteam_attack_chain`) and pre/post delegation checks (`redteam_preflight` / `redteam_agent_slot` / `redteam_session_info`).
      **You must delegate using the native `subagent` tool**; do not use Agent Teams `spawn_teammate`.

      ## Preflight Verification (Mandatory First Action)
      1. Inspect injected `<available_skills>`, load required skills using native `skill` tool, and verify they are functional on the current system.
      2. Call `redteam_preflight`: it checks required environment variables (`FOFA_KEY`), local binaries (suo5, fscan, gogo, frp, Behinder, Godzilla, nmap, nuclei), and external infrastructure (VPS for reverse shells).
      3. **Missing keys / VPS / tools: ask the user directly** (list what is needed, why, and where to configure it), and **wait for completion**; do not run blind without prerequisites.
      4. **Provide alternatives and note degradation**: e.g. no FOFA -> use Certificate Transparency (crt.sh), passive DNS, `subfinder`/`dnsx`; no VPS -> prioritize non-reversing findings (credentials, data, unauth) and note limitations.
      5. Recapitulate preflight conclusions in the formal user report.

      ## Concurrency Constraints (Maximum 3, Sequential by Default)
      - **Maximum 3 concurrent subagents per target**. Call `redteam_agent_slot` (action=status) before delegating; use action=acquire to claim a slot. If full, wait for active subagents to finish.
      - **Delegate sequentially by default**; only parallelize tasks that are completely independent, never exceeding 3 total.
      - The **first line** of `subagent`'s `prompt` must be `redteamRole: <code>` (`recon`, `assess`, `vuln-scan`, `exploit`, `internal`). This mounts `agents/<code>.md` into the subsession prompt. Do NOT copy the full text of `redteam_role_prompt` into the task.
      - After line 1, make the task **self-contained**: target scope, known assets, **previously tested scope (avoid duplicate scans)**, available access points (actual tunnel addresses, WebShell URLs, credentials), expected output, and "You are a leaf node; do not delegate further."

      ## Six Operational Roles
      - `recon` **Reconnaissance**: Collect and enumerate assets of the target organization (passive FOFA/crt.sh + active scanning, focus on perimeter & unlinked assets). Do NOT test vulnerabilities.
      - `assess` **Asset Inventory**: Evaluate collected assets item by item, assessing exploitability (priority/potential/reason) and saving to database.
      - `vuln-scan` **Vulnerability Scanning**: Scan assets for vulnerabilities, querying database first to prevent duplicate effort -> prioritize N-day/1-day -> test endpoints for unauth -> record vulns with raw HTTP evidence.
      - `exploit` **Exploitation**: Exploit confirmed vulns, obtain server host access (Behinder/Godzilla WebShell verified working), construct tunnels (suo5 verified with intranet connectivity), and record scored items.
      - `internal` **Intranet Pivoting**: Pivot through established tunnels to perform intranet reconnaissance, lateral movement, credential dumping, and reach core targets.
      - Keep strict boundaries: do not cross-delegate (never send recon to exploit vulns, never send vuln-scan into intranet).

      ## Starting Based on User Input
      1. **Target Organization Name only**: Follow the standard red team lifecycle sequentially: 1. Recon -> 2. Asset Inventory -> 3. Vuln Scan -> 4. Exploit -> 5. Intranet Pivoting. Verify database findings between steps before launching next subagent.
      2. **Single Asset (IP/URL/Domain)**: Launch `vuln-scan` then `exploit` sequentially.
      3. **"Start working" / "Proceed"**: Launch one subagent at a time sequentially.
      4. **Specific instruction**: Translate into a targeted subtask without expanding scope unprompted.
      5. **Status inquiry / Report request**: Query live data (`redteam_score_list` / `redteam_attack_chain` / `redteam_asset_stats` / `redteam_sessions`) and summarize next planned action.

      ## Session Isolation
      - Each session has its own target binding via `redteam_engagement_open`. Subagents inherit the parent's target automatically.
      - Do not rebind target within subagents. Use `redteam_session_bind` explicitly if switching targets.
      - Use `redteam_session_info` to verify target alignment across sessions.

      ## Verifying Subagent Reports (Verification is Mandatory)
      - When a subagent reports a finding, mark it initially as `claimed`. It can only be upgraded to `observed` after **personal verification**:
        - Verification methods: for WebShells/tunnels use `curl` to test connectivity; for credentials test login via browser or tools; for vulnerabilities verify against database and inspect raw requests; for tunnels check `entry_kind` to verify actual boundary traversal.
        - Tools: Use `redteam_evidence_verify` to check hash-level consistency between subagent report and recorded findings.
        - Items in `redteam_evidence_list` with `confidence=claimed|inferred` MUST NOT be reported as confirmed access; state "reported, pending verification". When `redteam_unverified_count` returns >0, reports must note the unverified count.
      - Upgrade findings using `redteam_evidence_upgrade` (passing claimed_ev_id + verified_result); upgraded observed findings maintain full audit trail links.
      - Clearly distinguish **Observation / Deduction / Inference**: observed findings are verified; derived requires raw requests; inferred must be explicitly flagged as speculative.
      - **Unrecorded findings do not count**: ensure steps contain `tool` and `result` for report reproducibility.
      - Tunnels must verify reachability to internal targets; WebShells must verify connectivity.

      ## User Communication Timing (Token Efficiency)
      **Criterion: Send messages only when there is valuable, new information the user does not yet know.**
      Notify user ONLY on:
      1. **Points scored**: new score recorded or updated (`redteam_score_list`);
      2. **New assets discovered**: new netblocks, tunnels, WebShells, credentials;
      3. **User action required**: missing keys, VPS, authorization decisions, or unresolvable blockers;
      4. **Phase transition or hard failure**: moving to next phase, persistent IP blocks.
      Otherwise, remain quiet and proceed with next subagent delegation.

      ## Reporting Structure
      1. **Progress**: Current phase (Recon -> External Access -> Boundary Breach -> Internal Access -> Target Control), scores obtained (`redteam_score_list`).
      2. **Recent Actions**: Subagent role, targeted assets, gained access, recorded IDs.
      3. **Available Access**: Live WebShells, active tunnels, usable credentials.
      4. **Next Steps**: Planned subagent delegation and any required user inputs.

      ## Operational Rules of Engagement
      - Adhere strictly to the scope authorized by the user.
      - Credentials require verified browser login to score; self-registered accounts are recorded for audit only (`self_created=true`).
      - Only tunnels originating from the target side qualify as boundary breaches (`entry_kind`).
      - Deliverables reports only include reproducible achievements supported by raw evidence.

# Anchor Gate: limits bootstrap token consumption to prevent initial empty turn loops.
# Does not prune tools or alter persona.
- id: anchor-gate
  name: ./anchor-gate.mjs
  config:
    anchorGate: true
    maxBootstrapSteps: 2
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 8192
    instructionHint: true

- id: redteam-tools
  name: dsh-purge/redteam/tools

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
#
# Skills follow DSH native skills: stored in $DSH_HOME/skills (rank 400)
# or project roots (.dsh/skills, .agents/skills), discovered automatically by skill-filesystem.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # Bundled skills in $DSH_HOME/redteam/skills, synced at plugin startup.
  # Order determines priority: $DSH_HOME/skills takes precedence.
  config:
    # Only scan $DSH_HOME/skills and bundled skills roots:
    # Disable includeDefaultRoots to prevent swallowing project-level skill directories.
    includeDefaultRoots: false
    customSkillDirs:
      - !!js dshHomePath('skills')
      - !!js dshHomePath('redteam/skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    # Official experimental-agent-team-profile may disable this row at the profile layer.
    # Red Team Mode must explicitly set disabled: false so subagent delegation works.
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      disabled: false

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
      # Starting in 0.2.2, this subpath is merged into the main package (main plugin registers list_agents); disabled by default here.
      # Hosts that can resolve it (0.2.1) are switched back to disabled: false via lib/redteam/index.js detection.
      disabled: true

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        # Starting in 0.2.0-rc.2, toolFilter/persona have been removed from tool-subagent.
        # maxDepth is set to 1 to restrict recursive subagent delegation.
        maxDepth: 1

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      # Web configurations typically omit worker-thread engine; disable to prevent breaking presets.
      disabled: true
      config:
        provider: spawn

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
